<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Midnight Celestial Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090e17"/>
      <stop offset="50%" stop-color="#0f1624"/>
      <stop offset="100%" stop-color="#161f30"/>
    </linearGradient>

    <!-- Warm Sandstone (Lit Face - Right) -->
    <linearGradient id="stoneLit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ebd2a2"/>
      <stop offset="100%" stop-color="#ceaa67"/>
    </linearGradient>

    <!-- Ancient Ochre (Shadow Face - Left) -->
    <linearGradient id="stoneDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a6133"/>
      <stop offset="100%" stop-color="#583c1c"/>
    </linearGradient>

    <!-- Terrace Terrace Top (Highlight) -->
    <linearGradient id="ledgeLit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff2d6"/>
      <stop offset="100%" stop-color="#deb77a"/>
    </linearGradient>

    <!-- Terrace Terrace Top (Shadowed) -->
    <linearGradient id="ledgeDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b88952"/>
      <stop offset="100%" stop-color="#734d24"/>
    </linearGradient>

    <!-- Lapis Lazuli Summit Altar -->
    <linearGradient id="lapisAltar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#213d5e"/>
      <stop offset="100%" stop-color="#3d6c99"/>
    </linearGradient>

    <!-- Divine Star Glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#f8d67b" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#d4932a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#121824" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)"/>
  <rect width="60" height="60" x="2" y="2" rx="13" fill="none" stroke="#cca862" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Plinth Horizon -->
  <path d="M7 53.5 L57 53.5" stroke="#cca862" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="9" y="53.5" width="46" height="2" fill="#2d1c0c" opacity="0.8"/>

  <!-- TIER 1 (Base: y 46 to 53.5) -->
  <!-- Shadow (Left) & Lit (Right) -->
  <polygon points="10,53.5 13.5,46 32,46 32,53.5" fill="url(#stoneDark)"/>
  <polygon points="32,53.5 32,46 50.5,46 54,53.5" fill="url(#stoneLit)"/>
  <!-- Terrace Walkway -->
  <polygon points="12.5,46 14.5,44.5 32,44.5 32,46" fill="url(#ledgeDark)"/>
  <polygon points="32,46 32,44.5 49.5,44.5 51.5,46" fill="url(#ledgeLit)"/>
  <!-- Pilasters -->
  <rect x="18" y="47" width="1.6" height="5.5" fill="#462c14" opacity="0.5"/>
  <rect x="24" y="47" width="1.6" height="5.5" fill="#462c14" opacity="0.5"/>
  <rect x="38" y="47" width="1.6" height="5.5" fill="#ebd2a2" opacity="0.6"/>
  <rect x="44" y="47" width="1.6" height="5.5" fill="#ebd2a2" opacity="0.6"/>
  <!-- Great Central Arch -->
  <path d="M28 53.5 L28 47.5 Q32 45 36 47.5 L36 53.5 Z" fill="#060b13"/>
  <path d="M29 53.5 L29 48.5 Q32 46.5 35 48.5 L35 53.5 Z" fill="#020408"/>
  <path d="M27.5 48 Q32 44.5 36.5 48" stroke="#ffe5ad" stroke-width="0.8" fill="none"/>

  <!-- TIER 2 (y 39 to 44.5) -->
  <polygon points="14.5,44.5 17.5,39 32,39 32,44.5" fill="url(#stoneDark)"/>
  <polygon points="32,44.5 32,39 46.5,39 49.5,44.5" fill="url(#stoneLit)"/>
  <polygon points="16.5,39 18.5,37.8 32,37.8 32,39" fill="url(#ledgeDark)"/>
  <polygon points="32,39 32,37.8 45.5,37.8 47.5,39" fill="url(#ledgeLit)"/>
  <!-- Windows -->
  <rect x="22" y="40.5" width="2" height="2.8" rx="1" fill="#3a2410"/>
  <rect x="40" y="40.5" width="2" height="2.8" rx="1" fill="#997538"/>

  <!-- TIER 3 (y 32 to 37.8) -->
  <polygon points="18.5,37.8 21.5,32 32,32 32,37.8" fill="url(#stoneDark)"/>
  <polygon points="32,37.8 32,32 42.5,32 45.5,37.8" fill="url(#stoneLit)"/>
  <polygon points="20.5,32 22.5,31 32,31 32,32" fill="url(#ledgeDark)"/>
  <polygon points="32,32 32,31 41.5,31 43.5,32" fill="url(#ledgeLit)"/>
  <!-- Center Watchport -->
  <rect x="31" y="33" width="2" height="3" rx="1" fill="#090f19"/>

  <!-- TIER 4 (y 25 to 31) -->
  <polygon points="22.5,31 25,25 32,25 32,31" fill="url(#stoneDark)"/>
  <polygon points="32,31 32,25 39,25 41.5,31" fill="url(#stoneLit)"/>
  <polygon points="24.5,25 26.5,24 32,24 32,25" fill="url(#ledgeDark)"/>
  <polygon points="32,25 32,24 37.5,24 39.5,25" fill="url(#ledgeLit)"/>

  <!-- TIER 5 - SUMMIT SHRINE (y 18.5 to 24) -->
  <polygon points="26.5,24 28,18.5 32,18.5 32,24" fill="url(#lapisAltar)"/>
  <polygon points="32,24 32,18.5 36,18.5 37.5,24" fill="#335d88"/>
  <polygon points="27.5,18.5 29,17.5 35,17.5 36.5,18.5" fill="#f8e5bd"/>
  <!-- Observatory Portal -->
  <rect x="31.2" y="19.5" width="1.6" height="3" rx="0.8" fill="#ffeaa3"/>

  <!-- INTEGRATED SPIRAL RAMPWAY (Ascending around the perimeter) -->
  <!-- Ramp 1: Ground to Tier 2 (Sweeping left to right up the base) -->
  <polygon points="10,53 11,51.5 33,45.5 34,47 10,53" fill="#ffe9b8" opacity="0.95"/>
  <line x1="11" y1="51.5" x2="33" y2="45.5" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Ramp 2: Tier 2 to Tier 3 (Sweeping back right to left across Tier 2) -->
  <polygon points="49.5,44.5 48,43.2 25,38.2 25.5,39.5 49.5,44.5" fill="#fed686" opacity="0.95"/>
  <line x1="48" y1="43.2" x2="25" y2="38.2" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Ramp 3: Tier 3 to Tier 4 (Left to right across Tier 3) -->
  <polygon points="18.5,37.8 19.5,36.5 36,31.2 36.8,32.2 18.5,37.8" fill="#ffe9b8" opacity="0.95"/>
  <line x1="19.5" y1="36.5" x2="36" y2="31.2" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round"/>
  <!-- Ramp 4: Tier 4 to Summit (Right to left up to the Observatory) -->
  <polygon points="41.5,31 40,29.8 28.5,24.5 29,25.5 41.5,31" fill="#fed686" opacity="0.95"/>
  <line x1="40" y1="29.8" x2="28.5" y2="24.5" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round"/>
  <!-- Ramp 5: Final approach into Sanctuary -->
  <line x1="28.5" y1="24.5" x2="32" y2="17.5" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>

  <!-- THE ZENITH STAR / BEACON OF HEAVEN -->
  <circle cx="32" cy="10" r="9.5" fill="url(#starGlow)"/>
  <!-- 4-Point Compass Star -->
  <path d="M32 2.5 L33.5 7.8 L39.5 10 L33.5 12.2 L32 17.5 L30.5 12.2 L24.5 10 L30.5 7.8 Z" fill="#ffffff"/>
  <!-- Secondary 4 Points -->
  <path d="M32 6 L34.8 7.2 L36 10 L34.8 12.8 L32 14 L29.2 12.8 L28 10 L29.2 7.2 Z" fill="#ffefbf" opacity="0.85"/>
  <!-- Core Point -->
  <circle cx="32" cy="10" r="1.5" fill="#ffffff"/>
</svg>
