<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <style>
    :root {
      color: #ffffff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        color: #0f172a;
      }
    }
    .tower-main {
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .tower-ramp {
      stroke: currentColor;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .tower-beacon {
      fill: currentColor;
    }
  </style>

  <!-- Foundation Ground Line -->
  <path d="M8 56 H56" class="tower-main" />

  <!-- Tier 1: Base Platform & Archway -->
  <path d="M12 56 L15 47 H49 L52 56" class="tower-main" />
  <path d="M27.5 56 V50 C27.5 47 36.5 47 36.5 50 V56" class="tower-main" />

  <!-- Tier 2: Mid-Lower Terrace -->
  <path d="M18 47 L21.5 38 H42.5 L46 47" class="tower-main" />

  <!-- Tier 3: Upper Terrace -->
  <path d="M24 38 L27 29 H37 L40 38" class="tower-main" />

  <!-- Tier 4: Summit Spire Platform -->
  <path d="M29.5 29 L31 22 H33 L34.5 29" class="tower-main" />

  <!-- Continuous Ascending Spiral Road (The Path of Babel) -->
  <path d="M12 55.5 L49 47" class="tower-ramp" />
  <path d="M46 46.5 L21.5 38" class="tower-ramp" />
  <path d="M24 37.5 L37 29" class="tower-ramp" />
  <path d="M37 28.5 L31 22" class="tower-ramp" />

  <!-- Zenith Celestial Beacon (The Star of Divine Language) -->
  <path d="M32 3 L33.8 8.2 L39 10 L33.8 11.8 L32 17 L30.2 11.8 L25 10 L30.2 8.2 Z" class="tower-beacon" />
</svg>
